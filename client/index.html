<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Flow AI — Enterprise Suite</title>
    <!-- Tailwind CSS with Forms and Container Queries -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              background: "#0b1326",
              surface: "#0b1326",
              "surface-container-lowest": "#060e20",
              "surface-container-low": "#131b2e",
              "surface-container": "#171f33",
              "surface-container-high": "#222a3d",
              "surface-container-highest": "#2d3449",
              primary: "#adc6ff",
              "primary-container": "#4d8eff",
              secondary: "#c0c1ff",
              "secondary-container": "#3131c0",
              tertiary: "#4edea3",
              "tertiary-container": "#00a572",
              "on-surface": "#dae2fd",
              "on-surface-variant": "#c2c6d6",
              outline: "#8c909f",
              "outline-variant": "#424754",
              error: "#ffb4ab",
              "error-container": "#93000a",
            },
            fontFamily: {
              sans: ["Hanken Grotesk", "Inter", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #0b1326;
        background-image: 
          radial-gradient(circle at 10% 20%, rgba(77, 142, 255, 0.08) 0%, transparent 45%),
          radial-gradient(circle at 90% 80%, rgba(49, 49, 192, 0.12) 0%, transparent 45%);
        background-attachment: fixed;
        color: #dae2fd;
        font-family: 'Hanken Grotesk', 'Inter', sans-serif;
      }
      .glass-panel {
        background-color: rgba(23, 31, 51, 0.65);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .glass-card {
        background-color: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .glass-card:hover {
        border-color: rgba(173, 198, 255, 0.3);
        box-shadow: 0 0 20px rgba(77, 142, 255, 0.15);
      }
      /* Custom Scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0b1326;
      }
      ::-webkit-scrollbar-thumb {
        background: #2d3449;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4d8eff;
      }
    </style>
  </head>
  <body class="bg-background text-on-surface min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
