name: HR Flow AI - CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Test Pipeline
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 3. Install Backend Dependencies
        run: npm install

      - name: 4. Install Frontend Dependencies
        run: npm install --prefix client

      - name: 5. Run Backend Static Analysis & Linting
        run: npm run lint:backend

      - name: 6. Run Frontend React Oxlint
        run: npm run lint:frontend

      - name: 7. Execute Backend Security & Authorization Tests
        timeout-minutes: 5
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URI: mongodb://127.0.0.1:27017/hrflow_ci_test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-jwt-secret-key-32-chars-long-production' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-fallback-gemini-api-key' }}
        run: npm test

      - name: 8. Build Frontend Production Bundle
        env:
          SKIP_TESTS: true
        run: npm run build

      - name: 9. Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: 10. Execute Playwright End-to-End Tests
        env:
          PORT: 5000
          MONGODB_URI: mongodb://127.0.0.1:27017/hrflow_ci_test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-jwt-secret-key-32-chars-long-production' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-fallback-gemini-api-key' }}
          CI: true
        run: npx playwright test

      - name: 11. Upload Playwright Test HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14
